name: SCOOS Probe (temporary)

# Throwaway workflow: the sandbox can't reach federalreserve.gov or FRED, so
# this runs on a GitHub runner just to discover how SCOOS data is published.
# Delete once fetch_scoos_data.py is written.

on:
  push:
    branches:
      - claude/yahoo-finance-stock-data-f0ff7y
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List FRED SCOOS release series
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          KEY = os.environ["FRED_API_KEY"]


          def fred(path, **params):
              params.update({"api_key": KEY, "file_type": "json"})
              url = "https://api.stlouisfed.org/fred/" + path + "?" + urllib.parse.urlencode(params)
              with urllib.request.urlopen(url, timeout=60) as resp:
                  return json.load(resp)


          offset = 0
          rows = []
          while True:
              data = fred("release/series", release_id=571, limit=1000, offset=offset)
              batch = data.get("seriess", [])
              rows.extend(batch)
              if len(batch) < 1000:
                  break
              offset += 1000

          print("TOTAL SCOOS SERIES:", len(rows))
          for s in rows:
              print(f"{s['id']}\t{s['frequency_short']}\t{s['units_short']}\t{s['title']}")
          PY
