name: SCOOS Probe (temporary)

on:
  push:
    branches:
      - claude/yahoo-finance-stock-data-f0ff7y
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect FRED SCOOS release series
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          KEY = os.environ["FRED_API_KEY"]


          def fred(path, **params):
              params.update({"api_key": KEY, "file_type": "json"})
              url = "https://api.stlouisfed.org/fred/" + path + "?" + urllib.parse.urlencode(params)
              with urllib.request.urlopen(url, timeout=60) as resp:
                  return json.load(resp)


          offset = 0
          rows = []
          while True:
              data = fred("release/series", release_id=571, limit=1000, offset=offset)
              batch = data.get("seriess", [])
              rows.extend(batch)
              if len(batch) < 1000:
                  break
              offset += 1000

          by_id = {r["id"]: r for r in rows}

          print("### SERIES WHOSE ID ENDS IN 'NP'")
          for r in rows:
              if r["id"].endswith("NP"):
                  print(f"{r['id']}\t{r['units_short']}\t{r['title'][:200]}")
          print()

          print("### QUESTIONS MENTIONING EQUITIES + (DEMAND|LIQUIDITY)")
          seen = set()
          for r in rows:
              t = r["title"].lower()
              if "equit" in t and ("demand" in t or "liquidity" in t):
                  m = re.match(r"^(\d+)\)", r["title"])
                  q = m.group(1) if m else "?"
                  if q not in seen:
                      seen.add(q)
                      print(f"  Q{q}: {r['title'][:200]}")
          print()

          for q in [54, 55, 58, 59, 64, 65, 68, 69, 72, 73, 76, 77]:
              print(f"### Q{q} SERIES")
              for r in rows:
                  if r["title"].startswith(f"{q})"):
                      answer = r["title"].split("Answer Type:")[-1].strip()
                      print(f"  {r['id']}\t{r['observation_start']}..{r['observation_end']}\t{answer}")
              print()

          print("### SAMPLE OBSERVATIONS for SFQ77PNNR")
          obs = fred("series/observations", series_id="SFQ77PNNR", sort_order="desc", limit=6)
          print(json.dumps(obs["observations"], indent=1))
          PY
