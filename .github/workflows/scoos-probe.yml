name: SCOOS Probe (temporary)

on:
  push:
    branches:
      - claude/yahoo-finance-stock-data-f0ff7y
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List SCOOS net-percentage exhibit series
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          KEY = os.environ["FRED_API_KEY"]


          def fred(path, **params):
              params.update({"api_key": KEY, "file_type": "json"})
              url = "https://api.stlouisfed.org/fred/" + path + "?" + urllib.parse.urlencode(params)
              with urllib.request.urlopen(url, timeout=60) as resp:
                  return json.load(resp)


          offset = 0
          rows = []
          while True:
              data = fred("release/series", release_id=571, limit=1000, offset=offset)
              batch = data.get("seriess", [])
              rows.extend(batch)
              if len(batch) < 1000:
                  break
              offset += 1000

          np_rows = sorted((r for r in rows if r["id"].endswith("NP")), key=lambda r: r["id"])
          print("NET PERCENTAGE SERIES:", len(np_rows))
          for r in np_rows:
              print(f"{r['id']}\t{r['frequency_short']}\t{r['observation_start']}..{r['observation_end']}\t{r['title']}")

          print()
          obs = fred("series/observations", series_id="EXHE3C5Q59NP", sort_order="desc", limit=10)
          print("EXHE3C5Q59NP latest:", [(o["date"], o["value"]) for o in obs["observations"]])
          obs = fred("series/observations", series_id="EXHE3C5Q59NP", sort_order="asc", limit=4)
          print("EXHE3C5Q59NP earliest:", [(o["date"], o["value"]) for o in obs["observations"]])
          PY
