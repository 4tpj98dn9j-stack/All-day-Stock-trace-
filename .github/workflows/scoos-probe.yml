name: SCOOS Probe (temporary)

# Throwaway workflow: the sandbox can't reach federalreserve.gov, so this runs
# on a GitHub runner just to discover how the Fed publishes SCOOS data.
# Delete once fetch_scoos_data.py is written.

on:
  push:
    branches:
      - claude/yahoo-finance-stock-data-f0ff7y
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe SCOOS pages
        run: |
          python - <<'PY'
          import re
          import urllib.request

          BASE = "https://www.federalreserve.gov"
          HEADERS = {"User-Agent": "Mozilla/5.0 (scoos-probe)"}


          def get(url):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=60) as resp:
                  return resp.status, resp.headers.get("Content-Type", ""), resp.read()


          def show_links(url):
              print("=" * 70)
              print("GET", url)
              try:
                  status, ctype, body = get(url)
              except Exception as exc:
                  print("  FAILED:", exc)
                  return []
              text = body.decode("utf-8", "replace")
              print("  status", status, ctype, len(body), "bytes")
              links = re.findall(r'<a[^>]+href="([^"]+)"[^>]*>(.*?)</a>', text, re.S | re.I)
              out = []
              for href, label in links:
                  label = re.sub(r"<[^>]+>", "", label).strip()
                  out.append((href, label))
              for href, label in out:
                  print("   LINK", href, "|", label[:80])
              return out


          links = show_links(BASE + "/data/scoos.htm")

          interesting = [
              h for h, _ in links
              if re.search(r"(csv|zip|xls|historical|chartdata|scoos20)", h, re.I)
          ]
          print()
          print("INTERESTING:", interesting[:40])

          for href in interesting[:6]:
              url = href if href.startswith("http") else BASE + href
              print("=" * 70)
              print("HEAD-ish", url)
              try:
                  status, ctype, body = get(url)
              except Exception as exc:
                  print("  FAILED:", exc)
                  continue
              print("  status", status, ctype, len(body), "bytes")
              print("  first 1500 bytes:")
              print(body[:1500].decode("utf-8", "replace"))
          PY
