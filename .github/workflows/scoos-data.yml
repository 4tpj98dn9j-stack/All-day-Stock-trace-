name: SCOOS Data

on:
  schedule:
    # SCOOS is quarterly, published a few weeks after each quarter ends.
    # Checking weekly (Mondays, 22:30 UTC) picks up a new release within a
    # week of it landing without hammering FRED for data that rarely moves.
    - cron: "30 22 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch SCOOS data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python fetch_scoos_data.py

      - name: Commit and push SCOOS data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scoos.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update SCOOS data for $(date -u +%Y-%m-%d)"
            git push
          fi
