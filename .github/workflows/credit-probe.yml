name: Credit Probe (temporary)

on:
  push:
    branches:
      - claude/yahoo-finance-stock-data-f0ff7y
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Find ICE BofA corporate OAS series by rating and maturity
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          KEY = os.environ["FRED_API_KEY"]


          def fred(path, **params):
              params.update({"api_key": KEY, "file_type": "json"})
              url = "https://api.stlouisfed.org/fred/" + path + "?" + urllib.parse.urlencode(params)
              with urllib.request.urlopen(url, timeout=60) as resp:
                  return json.load(resp)


          rows = []
          offset = 0
          while True:
              data = fred(
                  "series/search",
                  search_text="ICE BofA US Corporate Index Option-Adjusted Spread",
                  limit=1000,
                  offset=offset,
              )
              batch = data.get("seriess", [])
              rows.extend(batch)
              if len(batch) < 1000 or offset > 3000:
                  break
              offset += 1000

          oas = [
              r for r in rows
              if "Option-Adjusted Spread" in r["title"] and "US Corporate" in r["title"]
          ]
          print("US CORPORATE OAS SERIES:", len(oas))
          for r in sorted(oas, key=lambda r: r["title"]):
              print(f"{r['id']}\t{r['observation_end']}\t{r['title']}")

          print()
          print("### ANY TITLE COMBINING A RATING WITH A MATURITY BUCKET")
          rating = re.compile(r"\b(AAA|AA|A|BBB|BB|B|CCC)\b")
          maturity = re.compile(r"\d+\s*-\s*\d+\s*Year|\d+\+?\s*Year")
          for r in sorted(rows, key=lambda r: r["title"]):
              if (
                  "Option-Adjusted Spread" in r["title"]
                  and rating.search(r["title"])
                  and maturity.search(r["title"])
              ):
                  print(f"{r['id']}\t{r['title']}")
          PY
