name: Daily Report

on:
  schedule:
    # 21:30 UTC = after 4pm US market close on the NASDAQ, weekdays only.
    # Fixed UTC time; ~30-60min of slack around the EST/EDT boundary either
    # way is fine since this just needs to run after the close settles.
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate report
        run: python daily_report.py

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add daily report for $(date -u +%Y-%m-%d)"
            git push
          fi
