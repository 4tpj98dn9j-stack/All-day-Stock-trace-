name: Daily Report

on:
  schedule:
    # 23:00 UTC, weekdays. The US close is 21:00/22:00 UTC depending on DST;
    # waiting a couple of hours past it gives Yahoo time to settle the day's
    # final bars, which it doesn't always have done right after the bell.
    - cron: "0 23 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate report
        run: python daily_report.py

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add daily report for $(date -u +%Y-%m-%d)"
            git push
          fi
