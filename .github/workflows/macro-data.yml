name: Macro Data

on:
  schedule:
    # 22:00 UTC, daily -- shortly after the daily report runs.
    - cron: "0 22 * * *"
  workflow_dispatch: {}
  # TEMPORARY: seeds data/credit_curve.json on the feature branch before merge.
  push:
    branches:
      - claude/yahoo-finance-stock-data-f0ff7y

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch macro data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python fetch_macro_data.py

      - name: Fetch credit spread curve
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python fetch_credit_curve.py

      - name: Commit and push macro data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/macro.json data/credit_curve.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update macro data for $(date -u +%Y-%m-%d)"
            git push
          fi
