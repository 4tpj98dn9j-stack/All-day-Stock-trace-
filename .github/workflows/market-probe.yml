name: Market Charts Probe (temporary)

on:
  push:
    branches:
      - claude/yahoo-finance-stock-data-f0ff7y
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Probe Yahoo, FRED and CBOE
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          import yfinance as yf

          print("### YAHOO 6mo daily")
          for sym in ["^KS11", "^N225", "^TWII", "^NDX", "^GSPC", "DX-Y.NYB", "KRW=X", "CNY=X",
                      "JPY=X", "CL=F", "^VIX", "^VIX3M", "HYGH", "LQDH", "USHY", "^TNX", "VX=F"]:
              try:
                  h = yf.Ticker(sym).history(period="6mo", auto_adjust=True)["Close"].dropna()
                  print(f"  {sym:10s} rows={len(h):4d}  {h.index[0].date() if len(h) else '-'} .. "
                        f"{h.index[-1].date() if len(h) else '-'}  last={h.iloc[-1] if len(h) else None}")
              except Exception as exc:
                  print(f"  {sym:10s} FAILED {exc!r}")

          print("### FRED latest")
          key = os.environ["FRED_API_KEY"]
          for sid in ["DFEDTARU", "DFEDTARL", "BAMLH0A3HYC", "BAMLH0A1HYBB", "BAMLC0A4CBBB",
                      "T10YIE", "DGS3MO", "DGS2", "DGS10", "DFII10", "T10Y2Y", "T10Y3M", "DCOILWTICO"]:
              url = "https://api.stlouisfed.org/fred/series/observations?" + urllib.parse.urlencode(
                  {"series_id": sid, "api_key": key, "file_type": "json", "sort_order": "desc", "limit": 3})
              try:
                  obs = json.load(urllib.request.urlopen(url, timeout=30))["observations"]
                  print(f"  {sid:13s} {[(o['date'], o['value']) for o in obs]}")
              except Exception as exc:
                  print(f"  {sid:13s} FAILED {exc!r}")

          print("### CBOE VX futures")
          headers = {"User-Agent": "Mozilla/5.0"}
          for url in [
              "https://www.cboe.com/us/futures/market_statistics/historical_data/product/list/VX/",
              "https://cdn.cboe.com/data/us/futures/market_statistics/historical_data/VX/VX_2026-12-16.csv",
              "https://cdn.cboe.com/api/global/delayed_quotes/futures/VX.json",
          ]:
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as r:
                      body = r.read()
                  print(f"  OK {r.status} {len(body)}B {url}")
                  print("    " + body[:700].decode("utf-8", "replace").replace("\n", "\n    "))
              except Exception as exc:
                  print(f"  FAILED {url}: {exc!r}")
          PY
