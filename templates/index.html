<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주식 포트폴리오 대시보드</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>주식 포트폴리오</h1>
    <button id="refresh-btn">새로고침</button>
  </header>
  <p id="updated-at"></p>

  <section id="market-summary" class="market-summary">
    <h2 class="market-summary-title">나스닥 시황</h2>
    <div id="market-indices" class="market-indices"></div>
    <p id="market-comment" class="market-comment"></p>
  </section>

  <section id="daily-report-section" class="daily-report-section">
    <h2 class="daily-report-title">
      오늘의 리포트
      <span id="daily-report-date" class="daily-report-date"></span>
    </h2>
    <div id="daily-report-content" class="daily-report-content"></div>
  </section>

  <div id="cards" class="cards"></div>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button id="modal-close" class="modal-close" aria-label="닫기">&times;</button>
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
